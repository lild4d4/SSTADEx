[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sstadex"
version = "0.1.0"
description = "A library for running MNA with SPICE file conversion"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}  # Ajusta según tu licencia

# Dependencias principales (para usuarios de pip)
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "sympy>=1.9",
    "paretoset",
    "SymMNA @ git+https://github.com/lild4d4/Symbolic-modified-nodal-analysis.git@cc6bd3f568ddcef69173fc2499dae33547f1620d"
]

[project.optional-dependencies]
# Dependencias de desarrollo
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ipykernel",
    "jupyter",
    "black",
    "flake8",
    "mypy",
]

# Dependencias para notebooks
notebook = [
    "ipykernel",
    "jupyter",
    "matplotlib>=3.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sstadex*"]
exclude = ["test*", "docs*"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py"]